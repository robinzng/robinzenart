<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {{ $style := resources.Get "scss/style.scss" | toCSS | minify }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}">
    <link rel="icon" type="image/png" href="{{ `logo.png` | absURL }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono">
  </head>
  <body>
    <ul>
        <li><a href="/"> <img src="{{ `logo.png` | absURL }}" alt="Home" style="height:100px;"></a></li>
        <li><a href="/paintings"> <img src="{{ `paint.png` | absURL }}" alt="Paintings" style="height:100px;"></a></li>
    </ul>
    {{ block "page" . }}{{ end }}
  </body>
</html>
